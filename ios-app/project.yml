name: ArcaneExchange
options:
  bundleIdPrefix: fr.piconsoft
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Dev.xcconfig
  Release: Config/Release.xcconfig

# Ranges only: the versions built are pinned in APIClient/Package.resolved, the app's lockfile
# (see `upgrade-ios` in mise.toml).
packages:
  APIClient:
    path: APIClient
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    from: 1.2.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.0.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.0
  HTTPTypes:
    url: https://github.com/apple/swift-http-types
    from: 1.0.0
  # Card artwork loading. WebP (Gatherer) needs no plugin: Image I/O decodes it natively
  # since iOS 14, well under this project's iOS 18 floor.
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.2.0

targets:
  ArcaneExchange:
    type: application
    platform: iOS
    sources:
      - path: ArcaneExchange
        excludes:
          - Settings.bundle
      # Folder reference: a Settings bundle must be copied verbatim into the app, not
      # flattened into the resources build phase file by file.
      - path: ArcaneExchange/Settings.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ArcaneExchange/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The system accent (default `.tint`, prominent buttons, toggles) is the `primary`
        # role. Code names it `Palette.primary`, never `Color.accentColor`.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Primary
        # iPhone only ("1"). XcodeGen defaults to "1,2" (iPhone + iPad), which forces the app
        # to either declare the four interface orientations or opt out of iPad multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        # Feeds CFBundleDevelopmentRegion, the bundle's only supported localization — the app
        # ships no .lproj, every string is French in the source. XcodeGen's default (`en`)
        # makes iOS resolve the app's language to English, so everything the system formats
        # comes out English on a French device: "30 minutes ago" under the trades, "Cancel" in
        # system sheets. Covered by `TradeCopyTests.theAppsLanguageIsFrench`.
        DEVELOPMENT_LANGUAGE: fr
    dependencies:
      - package: APIClient
      - package: ClerkKit
        product: ClerkKit
      - package: ClerkKit
        product: ClerkKitUI
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
      - package: HTTPTypes
        product: HTTPTypes
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: ArcaneCore
      - target: ArcaneExchangeWidgets
    # Shared with the widget extension (`SharedContainer`): the App Group carries the API base
    # URL and the widgets' last snapshots, the Keychain group the Clerk session. Automatic
    # signing registers both on the first device build — a free account is enough.
    entitlements:
      path: ArcaneExchange/ArcaneExchange.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fr.piconsoft.arcane-exchange
        keychain-access-groups:
          - $(AppIdentifierPrefix)fr.piconsoft.arcane-exchange.shared
    info:
      path: ArcaneExchange/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        # The team prefix of the shared Keychain group, read by `SharedContainer`.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        # Without this the bundle claims no localization at all, iOS resolves the app's
        # language to English, and everything the system formats or labels comes out English
        # on a French device: "30 minutes ago" under the trades, "Cancel" in system sheets.
        # There is no .lproj to ship — every string is French in the source — so declaring the
        # localization here is enough to make Locale.current French.
        # Keyrune (set symbols), bundled under Support/Fonts — see KeyruneGlyph.swift.
        UIAppFonts:
          - Keyrune.ttf
        # Clerk's ASWebAuthenticationSession hands the SSO flow back on
        # `<bundle id>://callback` (ClerkKit's default `RedirectConfig`). The scheme has to be
        # registered here, and the full URL allowlisted on the Clerk instance
        # (Dashboard ▸ Native applications ▸ Allowlist for mobile SSO redirect).
        CFBundleURLTypes:
          - CFBundleURLName: ClerkOAuthCallback
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
          # Home-screen widget taps (`HomeWidgetLink.scheme`).
          - CFBundleURLName: HomeWidgetLink
            CFBundleURLSchemes:
              - arcane-exchange
        # ATS otherwise blocks the Dev config's plain-HTTP localhost backend.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true

  # Everything that is not a screen (ADR 0025): models, view models, networking, config, the
  # widget views and the color sets. The app embeds it, the widget extension links it, and
  # `ArcaneCoreTests` runs against it alone, with no host app. Types the other targets see are
  # `package` (see `SWIFT_PACKAGE_NAME` in Config/Shared.xcconfig).
  ArcaneCore:
    type: framework
    platform: iOS
    sources:
      - path: ArcaneCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Shared.xcconfig sets one identifier for every target: a framework needs its own, or
        # embedding fails ("did not contain an Info.plist / CFBundleIdentifier").
        PRODUCT_BUNDLE_IDENTIFIER: fr.piconsoft.arcane-exchange.core
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_LANGUAGE: fr
        # The widget extension links this framework.
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: APIClient
      - package: ClerkKit
        product: ClerkKit
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
      - package: HTTPTypes
        product: HTTPTypes
      - package: Nuke
        product: Nuke

  # The home-screen widgets (#473). They call the API themselves, with the session the app
  # opened: everything they share with it is listed under `SharedContainer`.
  ArcaneExchangeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ArcaneExchangeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.piconsoft.arcane-exchange.widgets
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_LANGUAGE: fr
    dependencies:
      # Linked, not embedded a second time: the app already carries the framework.
      - target: ArcaneCore
        embed: false
      - package: APIClient
      - package: ClerkKit
        product: ClerkKit
    entitlements:
      path: ArcaneExchangeWidgets/ArcaneExchangeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fr.piconsoft.arcane-exchange
        keychain-access-groups:
          - $(AppIdentifierPrefix)fr.piconsoft.arcane-exchange.shared
    info:
      path: ArcaneExchangeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Arcane Exchange
        API_BASE_URL: $(API_BASE_URL)
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true

  # Tests of the code living in `ArcaneCore/`: no host app (no TEST_HOST / BUNDLE_LOADER), so
  # xcodebuild skips installing and launching the app. Same file layout as the framework.
  ArcaneCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArcaneCoreTests
      # Shared with `ArcaneExchangeTests`: compiled into each bundle, no `@testable import`.
      - path: TestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.piconsoft.arcane-exchange.core-tests
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ArcaneCore
      - package: APIClient
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: HTTPTypes
        product: HTTPTypes
      - package: Nuke
        product: Nuke

  # Tests of the screens' code, hosted by the app (`@testable import ArcaneExchange`).
  ArcaneExchangeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArcaneExchangeTests
      - path: TestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Shared.xcconfig sets PRODUCT_BUNDLE_IDENTIFIER for every target; a test bundle that
        # shares its host app's identifier fails to load ("Unable to initialize test bundle").
        PRODUCT_BUNDLE_IDENTIFIER: fr.piconsoft.arcane-exchange.tests
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ArcaneExchange
      - target: ArcaneCore
      # Linked by the bundle itself: APIClient is a dynamic framework, which the host app's
      # executable does not re-export.
      - package: APIClient
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: HTTPTypes
        product: HTTPTypes

schemes:
  ArcaneExchange:
    build:
      targets:
        ArcaneExchange: all
        ArcaneCoreTests: [test]
        ArcaneExchangeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArcaneCoreTests
        - ArcaneExchangeTests
    archive:
      config: Release
