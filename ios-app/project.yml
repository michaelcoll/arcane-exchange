name: ArcaneExchange
options:
  bundleIdPrefix: fr.piconsoft
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Dev.xcconfig
  Release: Config/Release.xcconfig

packages:
  APIClient:
    path: APIClient
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    from: 1.2.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.0.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.0
  HTTPTypes:
    url: https://github.com/apple/swift-http-types
    from: 1.0.0
  # Card artwork loading. WebP (Gatherer) needs no plugin: Image I/O decodes it natively
  # since iOS 14, well under this project's iOS 18 floor.
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.2.0

targets:
  ArcaneExchange:
    type: application
    platform: iOS
    sources:
      - path: ArcaneExchange
        excludes:
          - Settings.bundle
      # Folder reference: a Settings bundle must be copied verbatim into the app, not
      # flattened into the resources build phase file by file.
      - path: ArcaneExchange/Settings.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ArcaneExchange/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only ("1"). XcodeGen defaults to "1,2" (iPhone + iPad), which forces the app
        # to either declare the four interface orientations or opt out of iPad multitasking.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: APIClient
      - package: ClerkKit
        product: ClerkKit
      - package: ClerkKit
        product: ClerkKitUI
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
      - package: HTTPTypes
        product: HTTPTypes
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    info:
      path: ArcaneExchange/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        UILaunchScreen: {}
        # Clerk's ASWebAuthenticationSession hands the SSO flow back on
        # `<bundle id>://callback` (ClerkKit's default `RedirectConfig`). The scheme has to be
        # registered here, and the full URL allowlisted on the Clerk instance
        # (Dashboard ▸ Native applications ▸ Allowlist for mobile SSO redirect).
        CFBundleURLTypes:
          - CFBundleURLName: ClerkOAuthCallback
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        # ATS otherwise blocks the Dev config's plain-HTTP localhost backend.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true

  ArcaneExchangeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArcaneExchangeTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Shared.xcconfig sets PRODUCT_BUNDLE_IDENTIFIER for every target; a test bundle that
        # shares its host app's identifier fails to load ("Unable to initialize test bundle").
        PRODUCT_BUNDLE_IDENTIFIER: fr.piconsoft.arcane-exchange.tests
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ArcaneExchange

schemes:
  ArcaneExchange:
    build:
      targets:
        ArcaneExchange: all
        ArcaneExchangeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArcaneExchangeTests
    archive:
      config: Release
