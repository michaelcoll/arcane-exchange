openapi: 3.1.0
info:
  title: Card Collection Price Tracker API
  description: 'REST API for tracking Magic: The Gathering card prices'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.1.0
paths:
  /autocomplete/user:
    get:
      tags:
      - autocomplete
      operationId: autocomplete_user
      parameters:
      - name: q
        in: query
        description: Partial username, fuzzy-matched (case-insensitive)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Matching usernames, max 10, ordered by similarity score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSuggestionResponse'
  /card/card-info:
    post:
      tags:
      - card
      operationId: get_card_info
      responses:
        '200':
          description: Card info from EDHRec
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /card/offers:
    get:
      tags:
      - card
      operationId: get_card_offers
      parameters:
      - name: set_code
        in: query
        description: Card's set code
        required: true
        schema:
          type: string
      - name: collector_number
        in: query
        description: Card's collector number
        required: true
        schema:
          type: string
      - name: language_code
        in: query
        description: Card's language code
        required: true
        schema:
          type: string
      - name: foil
        in: query
        description: Whether the card is foil
        required: true
        schema:
          type: boolean
      - name: sort_by
        in: query
        description: Sort field (only selling_price supported for now)
        required: false
        schema:
          $ref: '#/components/schemas/CardOffersSortByParam'
      - name: page
        in: query
        description: Page number, 0-based (default 0). `page * page_size` must not exceed 60
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: Items per page, 1 to 100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paginated list of sale offers for this card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCardOffersResponse'
        '400':
          description: Invalid or missing query params, or pagination out of bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No card found for this CardId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /card/{scryfall_id}/price-history:
    get:
      tags:
      - card
      operationId: get_card_price_history
      parameters:
      - name: scryfall_id
        in: path
        description: Card's Scryfall identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: foil
        in: query
        description: Whether to return the foil price series
        required: true
        schema:
          type: boolean
      - name: start_date
        in: query
        description: 'Start date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to end_date minus 30 days'
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: 'End date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to today'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Card price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEntryResponse'
        '400':
          description: Invalid date range (start_date > end_date), or missing `foil`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No card found for this scryfall_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /catalog/cards:
    get:
      tags:
      - catalog
      operationId: search_catalog
      parameters:
      - name: q
        in: query
        description: 'Name to search, English or French: substring or trigram similarity. Blank or absent matches every card'
        required: false
        schema:
          type: string
      - name: set_code
        in: query
        description: Restricts the search to a set
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number, 0-based (default 0). `page * page_size` must not exceed 1000
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: Items per page, 1 to 100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: The impressions of the catalog matching the search, by decreasing similarity of the name, then set code, then collector number. Tokens are not in the catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogResponse'
        '400':
          description: Pagination out of bounds, or invalid set code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /catalog/scan-index:
    get:
      tags:
      - catalog
      operationId: get_scan_index
      parameters:
      - name: If-None-Match
        in: header
        description: ETag of the index the client already has
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: 'The scan index: one entry per catalog card whose collector number is purely numeric. JSON compressed with gzip (`Content-Encoding: gzip`), with an `ETag` derived from a hash of its content.'
          headers:
            ETag:
              schema:
                type: string
              description: Hash of the content, unchanged by a catalog reload that changes nothing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanIndexEntryResponse'
        '304':
          description: The client's index is the current one
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No catalog is loaded yet (`scan_index_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /catalog/trend-prices:
    post:
      tags:
      - catalog
      operationId: get_trend_prices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrendPricesRequest'
        required: true
      responses:
        '200':
          description: 'One entry per requested card, in the order of the request: the latest Cardmarket trend price of each finish, in cents, `null` when there is none (card absent from the catalog, without Cardmarket id, or unpriced). Does not depend on the language, nor on anyone owning the card'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendPricesResponse'
        '400':
          description: More than 500 cards (`invalid_request`), or invalid set code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection:
    get:
      tags:
      - collection
      operationId: get_collection
      parameters:
      - name: page
        in: query
        description: Page number, 0-based (default 0). `page * page_size` must not exceed 10000
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: Items per page, 1 to 100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: sort_by
        in: query
        description: Sort field
        required: false
        schema:
          $ref: '#/components/schemas/SortByParam'
      - name: sort_dir
        in: query
        description: Sort direction
        required: false
        schema:
          $ref: '#/components/schemas/SortDirParam'
      - name: q
        in: query
        description: Fuzzy search on card name or set
        required: false
        schema:
          type: string
      - name: rarity
        in: query
        description: Rarity codes, repeated for multiple values (e.g. rarity=C&rarity=U)
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RarityCodeParam'
      - name: sets
        in: query
        description: Comma-separated set codes
        required: false
        schema:
          type: string
      - name: price_min
        in: query
        description: Minimum trend price in cents
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: price_max
        in: query
        description: Maximum trend price in cents
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paginated card collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionResponse'
        '400':
          description: Pagination out of bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/binders:
    get:
      tags:
      - binders
      operationId: list_binders
      responses:
        '200':
          description: The binders of the authenticated user, empty ones included, sorted by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindersResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - binders
      operationId: create_binder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BinderNameRequest'
        required: true
      responses:
        '201':
          description: Binder created, closed to trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinderResponse'
        '400':
          description: Blank or too long name; `code` is `invalid_binder_name`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The user already has a binder of this name; `code` is `binder_name_taken`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/binders/{id}:
    delete:
      tags:
      - binders
      operationId: delete_binder
      parameters:
      - name: id
        in: path
        description: Binder id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Empty binder deleted, with its trade opening
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Binder not found, or not owned by the caller; `code` is `binder_not_found`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The binder still holds copies; `code` is `binder_not_empty`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
    patch:
      tags:
      - binders
      operationId: rename_binder
      parameters:
      - name: id
        in: path
        description: Binder id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BinderNameRequest'
        required: true
      responses:
        '200':
          description: Binder renamed, its trade opening kept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinderResponse'
        '400':
          description: Blank or too long name; `code` is `invalid_binder_name`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Binder not found, or not owned by the caller; `code` is `binder_not_found`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The user already has a binder of this name; `code` is `binder_name_taken`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/cards/{set_code}/{collector_number}/{language_code}/entries:
    get:
      tags:
      - collection
      operationId: get_collection_entries
      parameters:
      - name: set_code
        in: path
        description: Set code of the card
        required: true
        schema:
          type: string
      - name: collector_number
        in: path
        description: Collector number of the card
        required: true
        schema:
          type: string
      - name: language_code
        in: path
        description: Language code of the card
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'What the caller owns of the card in both finishes, with the quantity committed by accepted trades per finish. Read from the collection itself: an edit shows at once'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEntriesResponse'
        '400':
          description: Invalid language code or collector number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/entries:
    post:
      tags:
      - collection
      operationId: add_collection_entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCollectionEntryRequest'
        required: true
      responses:
        '201':
          description: The entries of the card, after the addition. The copies join the entry of the same finish and binder when there is one (quantities add up, purchase price averaged, earliest added date), otherwise a new entry is written, with the `purchase_price` when given. With a `purchase_price`, a single card Purchase of the price times the quantity is recorded, dated today, in the same transaction. The card is created when it does not exist yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEntriesResponse'
        '400':
          description: Quantity out of 1 to 255 (`invalid_quantity`), also when a merge goes over 255; purchase price of 0 or less (`invalid_purchase_price`); `purchase_price` together with `sealed_product_id` (`invalid_request`); invalid set code, collector number or language code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No catalog card has this set and collector number (`card_not_in_catalog`), the binder is not one of the caller's (`binder_not_found`), or the sealed product does not exist, is another player's or is not a sealed product (`purchase_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/entries/{id}:
    delete:
      tags:
      - collection
      operationId: remove_collection_entry
      parameters:
      - name: id
        in: path
        description: Collection entry id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Entry removed
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entry not found, or not owned by the caller (`collection_entry_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The removal would take the owned copies under what accepted trades committed (`reserved_quantity_exceeded`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
    patch:
      tags:
      - collection
      operationId: update_collection_entry
      parameters:
      - name: id
        in: path
        description: Collection entry id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionEntryRequest'
        required: true
      responses:
        '200':
          description: 'The entries of the card, after the edit. A finish change onto an existing entry merges the two: quantities add up, purchase price is the average of the prices present weighted by quantity, added date is the earliest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEntriesResponse'
        '400':
          description: Quantity out of 1 to 255 (`invalid_quantity`), also when a merge goes over 255; purchase price of 0 or less (`invalid_purchase_price`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entry not found, or not owned by the caller (`collection_entry_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The edit would take the owned copies under what accepted trades committed (`reserved_quantity_exceeded`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/entries/{id}/move:
    post:
      tags:
      - collection
      operationId: move_collection_entry
      parameters:
      - name: id
        in: path
        description: Collection entry id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCollectionEntryRequest'
        required: true
      responses:
        '200':
          description: 'The entries of the card, after the move. The copies merge into the entry already in the target binder, with the same finish: quantities add up, purchase price is the average of the prices present weighted by quantity, added date is the earliest. The source entry is removed when it empties. A reserved card may be moved: the owned copies do not change'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEntriesResponse'
        '400':
          description: Quantity of 0 or over the entry's (`invalid_quantity`), also when a merge goes over 255
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entry not found, or not owned by the caller (`collection_entry_not_found`); binder not found, also another player's (`binder_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/import:
    get:
      tags:
      - collection
      operationId: list_card_imports
      responses:
        '200':
          description: The caller's imports, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardImportResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - collection
      operationId: import_cards
      requestBody:
        description: ManaBox CSV content (max 10 MB)
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: Import accepted, processing in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardImportStartedResponse'
        '400':
          description: Rejected file; `code` is `empty_file`, `malformed_csv`, `binder_export` or `unrecognized_format`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An import is already in progress for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/import/{id}:
    get:
      tags:
      - collection
      operationId: get_card_import
      parameters:
      - name: id
        in: path
        description: Import id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Import status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardImportResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Import not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/price-history:
    get:
      tags:
      - collection
      operationId: get_collection_price_history
      parameters:
      - name: start_date
        in: query
        description: 'Start date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to end_date minus 30 days'
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: 'End date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to today'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Collection price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEntryResponse'
        '400':
          description: Invalid date range (start_date > end_date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /collection/scan-batches:
    post:
      tags:
      - collection
      operationId: validate_scan_batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateScanBatchRequest'
        required: true
      responses:
        '200':
          description: 'The batch had been validated already: nothing is written, and the answer is the one of the first send'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBatchValidatedResponse'
        '201':
          description: The batch was added to the collection, all or none, in one transaction. Each line adds its copies like `POST /collection/entries` without purchase price (the card is created when it does not exist yet, copies join the entry of the same card, finish and binder), and joins the content of the sealed product when there is one. No Purchase is recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBatchValidatedResponse'
        '400':
          description: A batch without line or an identifier that is not a UUID (`invalid_request`); quantity out of 1 to 255 (`invalid_quantity`), also when a merge goes over 255; invalid set code, collector number or language code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
