      responses:
        '204':
          description: Card removed from the trade
        '400':
          description: Invalid payload, or owner_username is not a party to this trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a party to this trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trade not found, owner username unknown, or card not part of the trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Trade cannot be modified in its current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /trades/{trade_id}/confirm:
    post:
      tags:
      - trades
      operationId: confirm_trade
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Physical exchange confirmed
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a party to this trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Trade must be fully accepted before it can be confirmed, or already confirmed by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /trades/{trade_id}/rate:
    post:
      tags:
      - trades
      operationId: rate_trade
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateTradeRequest'
        required: true
      responses:
        '204':
          description: Rating recorded
        '400':
          description: Rating missing or out of the 0-5 range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a party to this trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Trade must be completed or abandoned by the other party before it can be rated, or already rated by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /user:
    post:
      tags:
      - auth
      operationId: register
      responses:
        '204':
          description: User registered/updated successfully
        '400':
          description: Missing username claim in token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /user/{username}:
    get:
      tags:
      - auth
      operationId: get_user_profile
      parameters:
      - name: username
        in: path
        description: Player username
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Username not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
components:
  schemas:
    AddCollectionEntryRequest:
      type: object
      description: A copy to add to the collection.
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - quantity
      properties:
        binder_id:
          type:
          - string
          - 'null'
          description: Binder to store the copies in; absent for none.
        collector_number:
          type: string
          description: Collector number of the catalog card.
        foil:
          type: boolean
        language_code:
          type: string
          description: 'Language of the copy: not checked against Scryfall, which may not have the card in it.'
        purchase_price:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Purchase price per copy, in cents, strictly positive. The copies carry it, and a single
            card Purchase of the price times the quantity is recorded, dated today; without it, no
            Purchase is recorded. Exclusive with `sealed_product_id` (`invalid_request`, 400). Signed
            so a value of 0 or less fails with `invalid_purchase_price` (400) instead of a JSON
            extractor rejection.
        quantity:
          type: integer
          format: int32
          description: |-
            Copies added, 1 to 255. Signed so an out-of-range value fails with `invalid_quantity`
            (400) instead of a JSON extractor rejection.
        sealed_product_id:
          type:
          - string
          - 'null'
          description: |-
            A sealed product of the player to attach the copies to: they are added without purchase
            price and the card joins the content of the sealed product. A product that does not exist,
            is another player's or is not a sealed product is refused with `purchase_not_found` (404).
        set_code:
          type: string
          description: Set code of the catalog card.
    AddTradeBinderRequest:
      type: object
      required:
      - binder_name
      properties:
        binder_name:
          type: string
    AddTradeCardRequest:
      type: object
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - owner_username
      properties:
        collector_number:
          type: string
        foil:
          type: boolean
        language_code:
          type: string
        owner_username:
          type: string
        set_code:
          type: string
    BinderInfoResponse:
      type: object
      required:
      - name
      - card_count
      properties:
        card_count:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
    BinderNameRequest:
      type: object
      description: Body of the creation and of the renaming of a binder.
      required:
      - name
      properties:
        name:
          type: string
    BinderResponse:
      type: object
      required:
      - id
      - name
      - copies
      - is_open
      properties:
        copies:
          type: integer
          format: int64
          description: 'Copies stored in the binder: the sum of its entries'' quantities, 0 when it is empty.'
          minimum: 0
        id:
          type: string
        is_open:
          type: boolean
          description: Whether the binder is open for trade.
        name:
          type: string
    BindersResponse:
      type: object
      required:
      - binders
      properties:
        binders:
          type: array
          items:
            $ref: '#/components/schemas/BinderResponse'
    CardEntriesResponse:
      type: object
      description: What the caller owns of a card in both finishes, with what the accepted Trades committed.
      required:
      - entries
      - reserved_quantity
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CollectionEntryDetailResponse'
        reserved_quantity:
          $ref: '#/components/schemas/ReservedQuantityResponse'
          description: |-
            The owned quantity of a finish, all binders together, cannot go under its reserved
            quantity.
    CardImportLineErrorResponse:
      type: object
      required:
      - line
      - field
      - value
      properties:
        field:
          type: string
        line:
          type: integer
          minimum: 0
        value:
          type: string
    CardImportResponse:
      type: object
      required:
      - id
      - status
      - source_lines
      - total_lines
      - processed_lines
      - errors
      - error_count
      - created_at
      properties:
        created_at:
          type: string
          description: RFC 3339 timestamp
        error_code:
          type:
          - string
          - 'null'
          description: |-
            Stable code of a failed import's error (`no_valid_line`, `internal`, …), translated by
            the clients. `null` unless the import failed.
        error_count:
          type: integer
          format: int32
          minimum: 0
        error_message:
          type:
          - string
          - 'null'
          description: Technical message of a failed import, for diagnosis only — never shown to the user.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CardImportLineErrorResponse'
          description: Truncated to at most 100 entries; `error_count` carries the true total.
        finished_at:
          type:
          - string
          - 'null'
          description: RFC 3339 timestamp
        id:
          type: string
        processed_lines:
          type: integer
          format: int32
          minimum: 0
        source_lines:
          type: integer
          format: int32
          description: Data lines read from the CSV, before the "Tokens" set filter and deduplication.
          minimum: 0
        status:
          type: string
          description: '`pending`, `running`, `completed` or `failed`.'
        total_lines:
          type: integer
          format: int32
          description: Cards to write, after deduplication — the denominator for `processed_lines`.
          minimum: 0
    CardImportStartedResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    CardOfferResponse:
      type: object
      required:
      - owner_username
      - quantity
      - reserved
      properties:
        owner_username:
          type: string
        quantity:
          type: integer
          format: int32
          description: |-
            Quantity this owner actually offers to trade — after applying their collection
            visibility, trade binder selection and rarity filters. Never the raw quantity they own:
            an owner offering `0` never appears in the list.
          minimum: 0
        reserved:
          type: boolean
          description: |-
            `true` if this exact copy is engaged in one of the owner's trades in `ONE_ACCEPTED` or
            `FULLY_ACCEPTED` status — it cannot be traded away right now.
        selling_price:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    CardOffersSortByParam:
      type: string
      enum:
      - selling_price
    CatalogCardResponse:
      type: object
      description: 'One impression of the catalog: a set and a collector number, without language or finish.'
      required:
      - set
      - collector_number
      - rarity_code
      - name
      properties:
        collector_number:
          type: string
        french_name:
          type:
          - string
          - 'null'
          description: French name; absent when Scryfall has none.
        image_url:
          type:
          - string
          - 'null'
          description: |-
            Scryfall image of the impression (its front face for a double-faced card), to load from
            Scryfall's CDN as is; `null` when Scryfall has none. It is not the image of a Card.
        name:
          type: string
          description: English name.
        rarity_code:
          type: string
          description: 'Rarity code: `C`, `U`, `R`, `M` or `S`.'
        set:
          $ref: '#/components/schemas/SetInfoResponse'
    CollectionCardResponse:
      type: object
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - name
      - rarity_code
      - scryfall_id
      - reserved
      properties:
        collection_entry:
          $ref: '#/components/schemas/CollectionEntryResponse'
          description: Present only when the card is owned by the authenticated user.
        collector_number:
          type: string
        foil:
          type: boolean
        image_back_url:
          type:
          - string
          - 'null'
          description: Back image of a double-faced card, like `image_url`; `null` for a single-faced card.
        image_url:
          type:
          - string
          - 'null'
          description: |-
            Front image, relative to the frontend (e.g. `/card-images/FDN_1_EN.webp?v=gatherer`);
            `null` while the card's image is pending.
        language_code:
          type: string
        name:
          type: string
        owner_count:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Number of distinct users actually offering this card to trade (search mode only) —
            after applying each owner's visibility, trade binder selection and rarity filters. A
            card no one offers anymore never appears in search results at all.
          minimum: 0
        price_guide:
          $ref: '#/components/schemas/PriceGuideResponse'
        rarity_code:
          type: string
        reserved:
          type: boolean
          description: |-
            `true` if this card is engaged in an `ONE_ACCEPTED` or `FULLY_ACCEPTED` trade of its
            owner (the authenticated user in collection mode, or the `player_username`-filtered
            owner in search mode). Always `false` in the unscoped multi-owner search, where no
            single owner can be attributed.
        scryfall_id:
          type: string
        set_code:
          type: string
    CollectionEntryDetailResponse:
      type: object
      description: 'One Collection entry of the caller: the copies of a card in one finish and one binder.'
      required:
      - id
      - foil
      - quantity
      - added_at
      properties:
        added_at:
          type: string
          description: RFC 3339 timestamp
        binder:
          $ref: '#/components/schemas/EntryBinderResponse'
          description: Absent for an entry stored in no binder.
        foil:
          type: boolean
        id:
          type: string
          description: Designates the entry in `PATCH` and `DELETE /collection/entries/{id}`.
        purchase_price:
          type:
          - integer
          - 'null'
          format: int32
          description: Price in cents; `null` when the copies have no purchase price.
          minimum: 0
        quantity:
          type: integer
          format: int32
          minimum: 0
    CollectionEntryResponse:
      type: object
      required:
      - quantity
      - added_at
      properties:
        added_at:
          type: string
          description: RFC 3339 timestamp
        purchase_price:
          type:
          - integer
          - 'null'
          format: int32
          description: Price in cents; `null` when the copies have no purchase price.
          minimum: 0
        quantity:
          type: integer
          format: int32
          minimum: 0
    CollectionStatsResponse:
      type: object
      required:
      - total_cards
      - unique_cards
      - binders
      properties:
        binders:
          type: array
          items:
            $ref: '#/components/schemas/BinderInfoResponse'
        price_trend_max:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        price_trend_min:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        total_cards:
          type: integer
          format: int64
          minimum: 0
        unique_cards:
          type: integer
          format: int64
          minimum: 0
    CollectionVisibilityParam:
      type: string
      enum:
      - public
      - trade
      - private
    CreateSealedProductRequest:
      type: object
      description: A sealed product to record.
      required:
      - product_type
      - set_code
      - amount_cents
      - purchased_on
      properties:
        amount_cents:
          type: integer
          format: int32
          description: |-
            Amount paid, in cents. Signed so an amount that is not strictly positive fails with
            `invalid_purchase_price` (400) instead of a JSON extractor rejection.
        name:
          type:
          - string
          - 'null'
          description: Free-text label; a blank name is stored as absent.
        product_type:
          $ref: '#/components/schemas/SealedProductTypeParam'
        purchased_on:
          type: string
          format: date
          description: Day of the purchase, `YYYY-MM-DD`.
        set_code:
          type: string
          description: Code of a known set.
    CreateTradeRequest:
      type: object
      required:
      - respondent_username
      properties:
        respondent_username:
          type: string
    CreateTradeResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    EnqueueResponse:
      type: object
      required:
      - enqueued
      properties:
        enqueued:
          type: integer
          minimum: 0
    EntryBinderResponse:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    ErrorResponse:
      type: object
      description: |-
        Body of every error response. `error` is a technical message, for diagnosis only; clients
        translate `code` into what they show the user (ADR 0018).
      required:
      - error
      - code
      properties:
        code:
          type: string
          description: Stable snake_case identifier of the error (e.g. `binder_export`, `internal`).
        error:
          type: string
          description: Technical message, in English — never shown to the user as is.
        lines:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UnknownCardResponse'
          description: |-
            Only for `card_not_in_catalog` on a scan batch: the cards of the batch the catalog does
            not have.
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    MoveCollectionEntryRequest:
      type: object
      properties:
        binder_id:
          type:
          - string
          - 'null'
          description: Target binder; `null` or absent moves the copies out of any binder.
        quantity:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Copies to move, 1 up to the entry's quantity; all of them when absent. Signed so an
            out-of-range value fails with `invalid_quantity` (400) instead of a JSON extractor
            rejection.
    PaginatedCardOffersResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CardOfferResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PaginatedCatalogResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCardResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PaginatedCollectionResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionCardResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PaginatedPurchasesResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PaginatedTradesResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TradeSummaryResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PriceGuideResponse:
      type: object
      properties:
        avg:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        low:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        trend:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    PriceHistoryEntryResponse:
      type: object
      required:
      - date
      - low
      - trend
      - avg
      properties:
        avg:
          type: integer
          format: int64
        date:
          type: string
          description: ISO 8601 date string (YYYY-MM-DD)
        low:
          type: integer
          format: int64
        trend:
          type: integer
          format: int64
    PurchaseContentLineResponse:
      type: object
      description: A card of the content of a Purchase, in a finish.
      required:
      - set_code
      - collector_number
      - language_code
      - name
      - foil
      - quantity
      properties:
        collector_number:
          type: string
        foil:
          type: boolean
        image_url:
          type:
          - string
          - 'null'
          description: Front image, `null` while it is pending.
        language_code:
          type: string
        name:
          type: string
        quantity:
          type: integer
          format: int32
          description: Copies of this card and finish the Purchase brought.
          minimum: 0
        set_code:
          type: string
        trend_cents:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Current Cardmarket trend price of the card in its finish, in cents; `null` when
            Cardmarket has none. Read on each request, never stored with the Purchase.
          minimum: 0
    PurchaseDetailResponse:
      type: object
      description: A Purchase with its content and its profitability.
      required:
      - purchase
      - content
      - content_value_cents
      - lines_without_trend
      - profitability_cents
      - profitability_percent
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseContentLineResponse'
        content_value_cents:
          type: integer
          format: int64
          description: Sum of the quantities times the trend price of the lines that have one, in cents.
          minimum: 0
        lines_without_trend:
          type: integer
          format: int32
          description: Lines left out of the value because they have no trend price.
          minimum: 0
        profitability_cents:
          type: integer
          format: int64
          description: |-
            Profitability: the value of the content minus the amount of the Purchase, in cents,
            negative when the content is worth less than was paid.
        profitability_percent:
          type: number
          format: double
          description: The profitability as a percentage of the amount of the Purchase.
        purchase:
          $ref: '#/components/schemas/PurchaseResponse'
    PurchaseKindResponse:
      type: string
      description: What a Purchase bought.
      enum:
      - sealed_product
      - single_card
    PurchaseResponse:
      type: object
      required:
      - id
      - kind
      - amount_cents
      - purchased_on
      properties:
        amount_cents:
          type: integer
          format: int32
          description: Amount paid, in cents.
          minimum: 0
        card:
          $ref: '#/components/schemas/PurchasedCardResponse'
          description: Single card only.
        foil:
          type:
          - boolean
          - 'null'
          description: 'Single card only: whether the copies are foil.'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/PurchaseKindResponse'
        name:
          type:
          - string
          - 'null'
          description: 'Sealed product only: the optional name the player gave it.'
        product_type:
          $ref: '#/components/schemas/SealedProductTypeParam'
          description: Sealed product only.
        purchased_on:
          type: string
          format: date
          description: Day of the purchase, `YYYY-MM-DD`.
        quantity:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Single card only: the copies bought.'
          minimum: 0
        set:
          $ref: '#/components/schemas/SetInfoResponse'
          description: Sealed product only.
    PurchasedCardResponse:
      type: object
      description: The card a single card Purchase bought.
      required:
      - set
      - collector_number
      - language_code
      - name
      properties:
        collector_number:
          type: string
        image_back_url:
          type:
          - string
          - 'null'
          description: Back image of a double-faced card, like `image_url`; `null` for a single-faced card.
        image_url:
          type:
          - string
          - 'null'
          description: |-
            Front image, relative to the frontend (e.g. `/card-images/FDN_1_EN.webp?v=gatherer`);
            `null` while the card's image is pending.
        language_code:
          type: string
        name:
          type: string
        set:
          $ref: '#/components/schemas/SetInfoResponse'
    RarityCodeParam:
      type: string
      enum:
      - C
      - U
      - R
      - M
      - S
    RarityFilterResponse:
      type: object
      required:
      - rarity
      - is_open
      - kept_copies
      - copies
      - proposed
      properties:
        copies:
          type: integer
          format: int64
          minimum: 0
        is_open:
          type: boolean
        kept_copies:
          type: integer
          format: int32
          minimum: 0
        proposed:
          type: integer
          format: int64
          minimum: 0
        rarity:
          type: string
    RarityFiltersResponse:
      type: object
      required:
      - rarities
      properties:
        rarities:
          type: array
          items:
            $ref: '#/components/schemas/RarityFilterResponse'
    RateTradeRequest:
      type: object
      required:
      - rating
      properties:
        rating:
          type: integer
          format: int32
          description: Rating given to the other party, from 0 to 5 inclusive.
          minimum: 0
    ReceivingBinderResponse:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    ReceivingBinderSettingResponse:
      type: object
      description: The receiving binder setting as stored.
      properties:
        binder:
          $ref: '#/components/schemas/ReceivingBinderResponse'
          description: 'Absent while the player chose none: their received cards go into a binder named `trades`.'
    RemoveTradeCardRequest:
      type: object
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - owner_username
      properties:
        collector_number:
          type: string
        foil:
          type: boolean
        language_code:
          type: string
        owner_username:
          type: string
        set_code:
          type: string
    ReservedQuantityResponse:
      type: object
      description: Copies committed by the accepted Trades, per finish.
      required:
      - normal
      - foil
      properties:
        foil:
          type: integer
          format: int32
          minimum: 0
        normal:
          type: integer
          format: int32
          minimum: 0
    ScanBatchLineRequest:
      type: object
      description: 'A line of a scan batch: copies of a card in a finish.'
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - quantity
      properties:
        collector_number:
          type: string
          description: Collector number of the catalog card.
        foil:
          type: boolean
        language_code:
          type: string
          description: Language of the copies.
        quantity:
          type: integer
          format: int32
          description: |-
            Copies of the line, 1 to 255. Signed so an out-of-range value fails with
            `invalid_quantity` (400) instead of a JSON extractor rejection.
        set_code:
          type: string
          description: Set code of the catalog card.
    ScanBatchValidatedResponse:
      type: object
      required:
      - copies_added
      properties:
        copies_added:
          type: integer
          format: int32
          description: 'Copies the batch adds to the collection: the sum of the quantities of its lines.'
          minimum: 0
    ScanIndexEntryResponse:
      type: object
      description: |-
        One entry of the scan index, keyed by set and collector number.

        The body of `GET /catalog/scan-index` is a JSON array of these; it is built and gzipped once
        per catalog load by the `ScanIndexUseCase` from the serialization of `ScanIndexEntry`, this
        type only documents its shape (a controller test decodes the served body as this type).
      required:
      - set_code
      - collector_number
      - rarity
      - name
      properties:
        collector_number:
          type: string
          description: Purely numeric collector number, without leading zeros.
        french_name:
          type:
          - string
          - 'null'
          description: French name; absent when Scryfall does not have one, the client then shows the English name.
        name:
          type: string
          description: English name.
        rarity:
          type: string
          description: 'Rarity code: `C`, `U`, `R`, `M` or `S`.'
        set_code:
          type: string
          description: Set code, 3 to 6 uppercase characters.
    SealedProductTypeParam:
      type: string
      enum:
      - BOOSTER
      - DISPLAY
      - BUNDLE
      - PRERELEASE_PACK
      - PRECONSTRUCTED_DECK
    SetInfoResponse:
      type: object
      description: A set, as several resources show it.
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    SetRarityFilterRequest:
      type: object
      required:
      - rarity
      - is_open
      - kept_copies
      properties:
        is_open:
          type: boolean
        kept_copies:
          type: integer
          format: int32
          description: |-
            Signed so out-of-range values (e.g. negative) fail domain validation with a clean 400
            instead of being rejected by the JSON extractor as a 422 before reaching the handler.
        rarity:
          type: string
    SetReceivingBinderRequest:
      type: object
      properties:
        binder_id:
          type:
          - string
          - 'null'
          description: Binder to receive into; absent to go back to the default.
    SetVisibilityRequest:
      type: object
      required:
      - visibility
      properties:
        visibility:
          $ref: '#/components/schemas/CollectionVisibilityParam'
    SortByParam:
      type: string
      enum:
      - avg
      - trend
      - set_code
      - language_code
      - added_at
    SortDirParam:
      type: string
      enum:
      - asc
      - desc
    StatsResponse:
      type: object
      description: Global platform statistics, public.
      required:
      - card_number
      - card_price_number
      - db_size_mb
      - proposed_copy_number
      properties:
        card_number:
          type: integer
          format: int32
          description: Number of Cards known to the platform.
          minimum: 0
        card_price_number:
          type: integer
          format: int32
          description: Number of Cardmarket prices recorded.
          minimum: 0
        db_size_mb:
          type: integer
          format: int32
          description: Database size, in MB.
          minimum: 0
        last_price_date:
          type:
          - string
          - 'null'
          description: |-
            ISO 8601 date string (YYYY-MM-DD) of the most recent Cardmarket price — prices are dated
            to the day. `null` until a price has been imported.
        proposed_copy_number:
          type: integer
          format: int32
          description: |-
            Copies offered for trade across the platform: the sum of every player's proposed
            quantities, after collection visibility, trading binders and rarity filters.
          minimum: 0
    TradeBindersResponse:
      type: object
      required:
      - binders
      properties:
        binders:
          type: array
          items:
            type: string
    TradeCardResponse:
      type: object
      description: |-
        One card offered in a trade, from either side. Which side it's on is conveyed by which of
        `TradeDetailResponse::my_cards`/`partner_cards` it's found in, not by a field here.
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - name
      - quantity
      - scryfall_id
      properties:
        collector_number:
          type: string
        foil:
          type: boolean
        image_back_url:
          type:
          - string
          - 'null'
          description: Back image of a double-faced card; `null` for a single-faced card.
        image_url:
          type:
          - string
          - 'null'
          description: Front image, relative to the frontend; `null` while the card's image is pending.
        language_code:
          type: string
        name:
          type: string
        price_guide:
          $ref: '#/components/schemas/PriceGuideResponse'
        quantity:
          type: integer
          format: int32
          minimum: 0
        scryfall_id:
          type: string
        set_code:
          type: string
    TradeDetailResponse:
      type: object
      required:
      - id
      - status
      - partner_username
      - my_cards
      - partner_cards
      - me
      - partner
      properties:
        id:
          type: string
        me:
          $ref: '#/components/schemas/TradePartyStateResponse'
        my_cards:
          type: array
          items:
            $ref: '#/components/schemas/TradeCardResponse'
        partner:
          $ref: '#/components/schemas/TradePartyStateResponse'
        partner_cards:
          type: array
          items:
            $ref: '#/components/schemas/TradeCardResponse'
        partner_username:
          type: string
        status:
          type: string
    TradePartyStateResponse:
      type: object
      description: |-
        One party's acceptance/confirmation/rating state, already resolved from the caller's point
        of view (`me` vs `partner`) — see `TradeDetailResponse`.
      required:
      - accepted
      - confirmed
      - abandoned
      properties:
        abandoned:
          type: boolean
        accepted:
          type: boolean
        confirmed:
          type: boolean
        rating:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    TradeStatusParam:
      type: string
      description: |-
        Status filter values for `GET /trades`, repeated for multiple statuses
        (e.g. `?status=PENDING&status=CLOSED`), mirroring `RarityCodeParam` on `/search/card`.
      enum:
      - PENDING
      - ONE_ACCEPTED
      - FULLY_ACCEPTED
      - COMPLETED
      - CLOSED
      - ABANDONED
    TradeSummaryResponse:
      type: object
      required:
      - id
      - status
      - partner_username
      - my_card_count
      - partner_card_count
      - updated_at
      properties:
        id:
          type: string
        my_card_count:
          type: integer
          format: int32
          minimum: 0
        partner_card_count:
          type: integer
          format: int32
          minimum: 0
        partner_username:
          type: string
        status:
          type: string
        updated_at:
          type: string
          description: RFC 3339 timestamp
    TrendPriceCardRequest:
      type: object
      description: 'A card to price, by set and collector number: no language, the price does not depend on it.'
      required:
      - set_code
      - collector_number
      properties:
        collector_number:
          type: string
          description: Collector number; leading zeros are ignored.
        set_code:
          type: string
          description: Set code, 3 to 6 characters.
    TrendPriceResponse:
      type: object
      description: The latest Cardmarket trend prices of one requested card.
      required:
      - set_code
      - collector_number
      properties:
        collector_number:
          type: string
          description: The collector number as requested.
        foil_trend_cents:
          type:
          - integer
          - 'null'
          format: int32
          description: Trend price of the foil finish, in cents; `null` when there is none.
          minimum: 0
        set_code:
          type: string
          description: The set code as requested, uppercased.
        trend_cents:
          type:
          - integer
          - 'null'
          format: int32
          description: Trend price of the normal finish, in cents; `null` when there is none.
          minimum: 0
    TrendPricesRequest:
      type: object
      required:
      - cards
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/TrendPriceCardRequest'
          description: The cards to price, 500 at most.
    TrendPricesResponse:
      type: object
      description: The trend prices of the requested cards, in the order of the request.
      required:
      - prices
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TrendPriceResponse'
    UnknownCardResponse:
      type: object
      description: A card of a scan batch the catalog does not have, as the batch named it.
      required:
      - set_code
      - collector_number
      - language_code
      properties:
        collector_number:
          type: string
        language_code:
          type: string
        set_code:
          type: string
    UpdateCollectionEntryRequest:
      type: object
      properties:
        foil:
          type:
          - boolean
          - 'null'
          description: New finish. A change onto an existing entry merges the two.
        purchase_price:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            New purchase price per copy, in cents, strictly positive: it replaces the entry's and
            creates or changes no purchase. Signed so a value of 0 or less fails with
            `invalid_purchase_price` (400) instead of a JSON extractor rejection.
        quantity:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            New quantity, 1 to 255. Signed so an out-of-range value fails with `invalid_quantity`
            (400) instead of a JSON extractor rejection.
    UpdatePurchaseRequest:
      type: object
      description: The fields of a Purchase to change; those left out are kept.
      properties:
        amount_cents:
          type:
          - integer
          - 'null'
          format: int32
          description: Amount paid, in cents, strictly positive (`invalid_purchase_price`, 400).
        name:
          type:
          - string
          - 'null'
          description: An empty name clears the stored one.
        product_type:
          $ref: '#/components/schemas/SealedProductTypeParam'
        purchased_on:
          type:
          - string
          - 'null'
          format: date
          description: Day of the purchase, `YYYY-MM-DD`.
        set_code:
          type:
          - string
          - 'null'
          description: Code of a known set.
    UserProfileResponse:
      type: object
      required:
      - id
      properties:
        avatar_url:
          type:
          - string
          - 'null'
        id:
          type: string
        username:
          type:
          - string
          - 'null'
    UserSuggestionResponse:
      type: object
      description: |-
        A suggested user only appears if they offer at least one card to trade — a `private` user,
        or one offering nothing under their current visibility/binders/rarity filters, is never
        suggested.
      required:
      - username
      - note
      - card_count
      properties:
        card_count:
          type: integer
          format: int64
          description: |-
            Sum of the quantities this user actually offers to trade across their whole collection —
            not their total collection size.
          minimum: 0
        note:
          type: integer
          format: int32
          description: Always 5 — hardcoded display value, not backed by any stored rating yet.
          minimum: 0
        username:
          type: string
    ValidateScanBatchRequest:
      type: object
      description: A scan batch to add to the collection, all or none.
      required:
      - batch_id
      - lines
      properties:
        batch_id:
          type: string
          description: |-
            Identifier of the batch, a UUID generated by the client when it creates the batch and kept
            until a validation succeeds: it makes the validation idempotent. One that is not a UUID is
            refused with `invalid_request` (400).
        binder_id:
          type:
          - string
          - 'null'
          description: Binder to store the copies in; absent for none.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ScanBatchLineRequest'
          description: The lines of the batch, at least one.
        sealed_product_id:
          type:
          - string
          - 'null'
          description: |-
            A sealed product of the player whose content the cards join. They come without purchase
            price whether or not there is one, and no Purchase is recorded.
    VisibilityResponse:
      type: object
      required:
      - visibility
      properties:
        visibility:
          $ref: '#/components/schemas/CollectionVisibilityParam'
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: card
  description: Single card lookup, price history and sale offers (authentication required)
- name: collection
  description: Player's private collection (authentication required, no public catalog)
- name: binders
  description: 'Binders a player stores their collection in: list, creation, renaming, deletion of an empty one (authentication required)'
- name: purchases
  description: 'What a player bought to enrich their collection: sealed products bought, listed, edited and deleted without touching the collection (authentication required)'
- name: trade-settings
  description: 'Settings deciding what of a player''s collection is exposed for trade: visibility, binders open for trade, rarity filters (authentication required)'
- name: search
  description: Public card search across all users' collections (authentication required)
- name: maintenance
  description: Maintenance operations (public)
- name: auth
  description: Authentication and user registration (authentication required)
- name: trades
  description: Trade requests between two collectors (authentication required)
- name: autocomplete
  description: Public username autocomplete (no authentication)
- name: sets
  description: Set catalog lookup (no authentication)
- name: stats
  description: Global platform statistics (no authentication)
- name: showcase
  description: Showcase of the most expensive cards held on the platform (no authentication)
