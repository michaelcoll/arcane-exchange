coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        threshold: 5%

  range: 60..80
  round: down
  precision: 2

comment:
  layout: "reach,diff,files"
  behavior: default
  require_changes: true

flags:
  rust:
    paths:
      - "backend/src/**"
      - "backend/Cargo.toml"

ignore:
  - "ccpt_local/**"
  - "collection/**"
  - "example-files/**"
  - "backend/migrations/**"
  - "node_modules/**"
  - "backend/target/**"
  - "backend/src/ae/generate_openapi.rs"
  - "backend/src/ae/infrastructure.rs"
  - "backend/src/ae/main.rs"
