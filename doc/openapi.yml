openapi: 3.1.0
info:
  title: Card Collection Price Tracker API
  description: 'REST API for tracking Magic: The Gathering card prices'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.1.0
paths:
  /autocomplete/user:
    get:
      tags:
      - autocomplete
      operationId: autocomplete_user
      parameters:
      - name: q
        in: query
        description: Partial username, fuzzy-matched (case-insensitive)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Matching usernames, max 10, ordered by similarity score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSuggestionResponse'
  /card/card-info:
    post:
      tags:
      - card
      operationId: get_card_info
      responses:
        '200':
          description: Card info from EDHRec
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
  /card/offers:
    get:
      tags:
      - card
      operationId: get_card_offers
      parameters:
      - name: set_code
        in: query
        description: Card's set code
        required: true
        schema:
          type: string
      - name: collector_number
        in: query
        description: Card's collector number
        required: true
        schema:
          type: string
      - name: language_code
        in: query
        description: Card's language code
        required: true
        schema:
          type: string
      - name: foil
        in: query
        description: Whether the card is foil
        required: true
        schema:
          type: boolean
      - name: sort_by
        in: query
        description: Sort field (only selling_price supported for now)
        required: false
        schema:
          $ref: '#/components/schemas/CardOffersSortByParam'
      - name: page
        in: query
        description: Page number (starts at 0, max 10)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: Items per page (1 to 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paginated list of sale offers for this card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCardOffersResponse'
        '400':
          description: Invalid or missing query params
        '401':
          description: Missing or invalid token
        '404':
          description: No card found for this CardId
      security:
      - bearer_auth: []
  /card/{scryfall_id}/price-history:
    get:
      tags:
      - card
      operationId: get_card_price_history
      parameters:
      - name: scryfall_id
        in: path
        description: Card's Scryfall identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: start_date
        in: query
        description: 'Start date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to end_date minus 30 days'
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: 'End date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to today'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Card price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEntryResponse'
        '400':
          description: Invalid date range (start_date > end_date)
        '401':
          description: Missing or invalid token
        '404':
          description: No card found for this scryfall_id
      security:
      - bearer_auth: []
  /collection:
    get:
      tags:
      - collection
      operationId: get_collection
      parameters:
      - name: page
        in: query
        description: Page number (starts at 0)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: Items per page (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: sort_by
        in: query
        description: Sort field
        required: false
        schema:
          $ref: '#/components/schemas/SortByParam'
      - name: sort_dir
        in: query
        description: Sort direction
        required: false
        schema:
          $ref: '#/components/schemas/SortDirParam'
      - name: q
        in: query
        description: Fuzzy search on card name or set
        required: false
        schema:
          type: string
      - name: rarity
        in: query
        description: Rarity codes, repeated for multiple values (e.g. rarity=C&rarity=U)
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RarityCodeParam'
      - name: sets
        in: query
        description: Comma-separated set codes
        required: false
        schema:
          type: string
      - name: price_min
        in: query
        description: Minimum trend price in cents
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: price_max
        in: query
        description: Maximum trend price in cents
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paginated card collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
  /collection/import:
    post:
      tags:
      - collection
      operationId: import_cards
      requestBody:
        description: ManaBox CSV content (max 10 MB)
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Import successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid body (non UTF-8, ...)
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
  /collection/price-history:
    get:
      tags:
      - collection
      operationId: get_collection_price_history
      parameters:
      - name: start_date
        in: query
        description: 'Start date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to end_date minus 30 days'
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: 'End date (ISO 8601: YYYY-MM-DD, inclusive). Defaults to today'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Collection price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistoryEntryResponse'
        '400':
          description: Invalid date range (start_date > end_date)
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
  /collection/stats:
    get:
      tags:
      - collection
      operationId: get_collection_stats
      responses:
        '200':
          description: Collection stats for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStatsResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
  /maintenance/stats:
    get:
      tags:
      - maintenance
      operationId: get_stats
      responses:
        '200':
          description: Global database statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
  /maintenance/trigger-price-update:
    post:
      tags:
      - maintenance
      operationId: trigger_price_update
      responses:
        '204':
          description: Price update triggered successfully
  /maintenance/update-cardmarket-ids:
    post:
      tags:
      - maintenance
      operationId: update_cardmarket_ids
      responses:
        '202':
          description: CardMarket IDs enqueued for update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueResponse'
  /search/card:
    get:
      tags:
      - search
      operationId: search_cards
      parameters:
      - name: page
        in: query
        description: Page number (starts at 0)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: Items per page (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: sort_by
        in: query
        description: Sort field
        required: false
        schema:
          $ref: '#/components/schemas/SortByParam'
      - name: sort_dir
        in: query
        description: Sort direction
        required: false
        schema:
          $ref: '#/components/schemas/SortDirParam'
      - name: q
        in: query
        description: Fuzzy search on card name or set
        required: false
        schema:
          type: string
      - name: rarity
        in: query
        description: Rarity codes, repeated for multiple values (e.g. rarity=C&rarity=U)
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RarityCodeParam'
      - name: sets
        in: query
        description: Comma-separated set codes
        required: false
        schema:
          type: string
      - name: price_min
        in: query
        description: Minimum trend price in cents
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: price_max
        in: query
        description: Maximum trend price in cents
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: player_username
        in: query
        description: Exact username of the owner to filter by (case-insensitive, no partial match)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated card search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
  /trades:
    get:
      tags:
      - trades
      operationId: list_trades
      parameters:
      - name: page
        in: query
        description: Page number (starts at 0)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: Items per page (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: status
        in: query
        description: Trade status, repeated for multiple values (e.g. status=PENDING&status=CLOSED)
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TradeStatusParam'
      responses:
        '200':
          description: Paginated list of trades the caller is a party to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTradesResponse'
        '400':
          description: Invalid status filter
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - trades
      operationId: create_trade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTradeRequest'
        required: true
      responses:
        '201':
          description: Trade created (or the existing active trade with this user), without any card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTradeResponse'
        '400':
          description: Invalid payload, or respondent is the caller
        '401':
          description: Missing or invalid token
        '404':
          description: Respondent username unknown
      security:
      - bearer_auth: []
  /trades/{trade_id}:
    get:
      tags:
      - trades
      operationId: get_trade
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Trade detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeDetailResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a party to this trade
        '404':
          description: Trade not found
      security:
      - bearer_auth: []
  /trades/{trade_id}/abandon:
    post:
      tags:
      - trades
      operationId: abandon_trade
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Trade abandoned
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a party to this trade
        '404':
          description: Trade not found
        '409':
          description: Trade is already finalized and cannot be abandoned
      security:
      - bearer_auth: []
  /trades/{trade_id}/accept:
    post:
      tags:
      - trades
      operationId: accept_trade
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Trade accepted
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a party to this trade
        '404':
          description: Trade not found
        '409':
          description: Trade cannot be accepted in its current status, or already accepted by the caller
      security:
      - bearer_auth: []
  /trades/{trade_id}/cards:
    post:
      tags:
      - trades
      operationId: add_trade_card
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTradeCardRequest'
        required: true
      responses:
        '204':
          description: Card added to the trade (quantity incremented if already present)
        '400':
          description: Invalid payload, or owner_username is not a party to this trade
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a party to this trade
        '404':
          description: Trade not found, owner username unknown, or card not owned in sufficient quantity
        '409':
          description: Trade cannot be modified in its current status, or the card is already reserved by another trade
      security:
      - bearer_auth: []
  /trades/{trade_id}/cards/remove:
    post:
      tags:
      - trades
      operationId: remove_trade_card
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveTradeCardRequest'
        required: true
      responses:
        '204':
          description: Card removed from the trade
        '400':
          description: Invalid payload, or owner_username is not a party to this trade
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a party to this trade
        '404':
          description: Trade not found, owner username unknown, or card not part of the trade
        '409':
          description: Trade cannot be modified in its current status
      security:
      - bearer_auth: []
  /trades/{trade_id}/confirm:
    post:
      tags:
      - trades
      operationId: confirm_trade
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Physical exchange confirmed
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a party to this trade
        '404':
          description: Trade not found
        '409':
          description: Trade must be fully accepted before it can be confirmed, or already confirmed by the caller
      security:
      - bearer_auth: []
  /trades/{trade_id}/rate:
    post:
      tags:
      - trades
      operationId: rate_trade
      parameters:
      - name: trade_id
        in: path
        description: Trade id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateTradeRequest'
        required: true
      responses:
        '204':
          description: Rating recorded
        '400':
          description: Rating missing or out of the 0-5 range
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a party to this trade
        '404':
          description: Trade not found
        '409':
          description: Trade must be completed before it can be rated, or already rated by the caller
      security:
      - bearer_auth: []
  /user/register:
    post:
      tags:
      - auth
      operationId: register
      responses:
        '204':
          description: User registered/updated successfully
        '400':
          description: Missing username claim in token
        '401':
          description: Missing or invalid authentication token
      security:
      - bearer_auth: []
  /user/trade-binders:
    get:
      tags:
      - auth
      operationId: get_trade_binders
      responses:
        '200':
          description: Binders selected for trade by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeBindersResponse'
        '401':
          description: Missing or invalid authentication token
      security:
      - bearer_auth: []
    post:
      tags:
      - auth
      operationId: add_trade_binder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTradeBinderRequest'
        required: true
      responses:
        '204':
          description: Binder selected for trade
        '400':
          description: Binder name is empty
        '401':
          description: Missing or invalid authentication token
        '404':
          description: Binder not found in the authenticated user's collection
      security:
      - bearer_auth: []
  /user/trade-binders/{name}:
    delete:
      tags:
      - auth
      operationId: remove_trade_binder
      parameters:
      - name: name
        in: path
        description: Binder name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Binder deselected for trade
        '401':
          description: Missing or invalid authentication token
      security:
      - bearer_auth: []
  /user/visibility:
    get:
      tags:
      - auth
      operationId: get_visibility
      responses:
        '200':
          description: Current collection visibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisibilityResponse'
        '401':
          description: Missing or invalid authentication token
        '404':
          description: Authenticated user has never registered
      security:
      - bearer_auth: []
    put:
      tags:
      - auth
      operationId: set_visibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVisibilityRequest'
        required: true
      responses:
        '204':
          description: Visibility updated successfully
        '400':
          description: Invalid visibility value
        '401':
          description: Missing or invalid authentication token
        '404':
          description: Authenticated user has never registered
      security:
      - bearer_auth: []
components:
  schemas:
    AddTradeBinderRequest:
      type: object
      required:
      - binder_name
      properties:
        binder_name:
          type: string
    AddTradeCardRequest:
      type: object
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - owner_username
      - quantity
      properties:
        collector_number:
          type: string
        foil:
          type: boolean
        language_code:
          type: string
        owner_username:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 0
        set_code:
          type: string
    BinderInfoResponse:
      type: object
      required:
      - name
      - card_count
      properties:
        card_count:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
    CardOfferResponse:
      type: object
      required:
      - owner_username
      - quantity
      - reserved
      properties:
        owner_username:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 0
        reserved:
          type: boolean
          description: |-
            `true` if this exact copy is engaged in one of the owner's trades in `ONE_ACCEPTED` or
            `FULLY_ACCEPTED` status — it cannot be traded away right now.
        selling_price:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    CardOffersSortByParam:
      type: string
      enum:
      - selling_price
    CollectionCardResponse:
      type: object
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - name
      - rarity_code
      - scryfall_id
      - reserved
      properties:
        collection_entry:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CollectionEntryResponse'
            description: Present only when the card is owned by the authenticated user.
        collector_number:
          type: string
        foil:
          type: boolean
        language_code:
          type: string
        name:
          type: string
        owner_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of distinct users owning this card (search mode only).
          minimum: 0
        price_guide:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PriceGuideResponse'
        rarity_code:
          type: string
        reserved:
          type: boolean
          description: |-
            `true` if this card is engaged in an `ONE_ACCEPTED` or `FULLY_ACCEPTED` trade of its
            owner (the authenticated user in collection mode, or the `player_username`-filtered
            owner in search mode). Always `false` in the unscoped multi-owner search, where no
            single owner can be attributed.
        scryfall_id:
          type: string
        set_code:
          type: string
        the_gatherer_id:
          type:
          - string
          - 'null'
    CollectionEntryResponse:
      type: object
      required:
      - quantity
      - purchase_price
      - added_at
      properties:
        added_at:
          type: string
          description: RFC 3339 timestamp
        purchase_price:
          type: integer
          format: int32
          minimum: 0
        quantity:
          type: integer
          format: int32
          minimum: 0
    CollectionStatsResponse:
      type: object
      required:
      - total_cards
      - unique_cards
      - sets
      - binders
      properties:
        binders:
          type: array
          items:
            $ref: '#/components/schemas/BinderInfoResponse'
        price_trend_max:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        price_trend_min:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetInfoResponse'
        total_cards:
          type: integer
          format: int64
          minimum: 0
        unique_cards:
          type: integer
          format: int64
          minimum: 0
    CollectionVisibilityParam:
      type: string
      enum:
      - public
      - trade
      - private
    CreateTradeRequest:
      type: object
      required:
      - respondent_username
      properties:
        respondent_username:
          type: string
    CreateTradeResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    EnqueueResponse:
      type: object
      required:
      - enqueued
      properties:
        enqueued:
          type: integer
          minimum: 0
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    PaginatedCardOffersResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CardOfferResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PaginatedCollectionResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionCardResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PaginatedTradesResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TradeSummaryResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PriceGuideResponse:
      type: object
      properties:
        avg:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        low:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        trend:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    PriceHistoryEntryResponse:
      type: object
      required:
      - date
      - low
      - trend
      - avg
      properties:
        avg:
          type: integer
          format: int64
        date:
          type: string
          description: ISO 8601 date string (YYYY-MM-DD)
        low:
          type: integer
          format: int64
        trend:
          type: integer
          format: int64
    RarityCodeParam:
      type: string
      enum:
      - C
      - U
      - R
      - M
      - S
    RateTradeRequest:
      type: object
      required:
      - rating
      properties:
        rating:
          type: integer
          format: int32
          description: Rating given to the other party, from 0 to 5 inclusive.
          minimum: 0
    RemoveTradeCardRequest:
      type: object
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - owner_username
      properties:
        collector_number:
          type: string
        foil:
          type: boolean
        language_code:
          type: string
        owner_username:
          type: string
        set_code:
          type: string
    SetInfoResponse:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    SetVisibilityRequest:
      type: object
      required:
      - visibility
      properties:
        visibility:
          $ref: '#/components/schemas/CollectionVisibilityParam'
    SortByParam:
      type: string
      enum:
      - avg
      - trend
      - set_code
      - language_code
    SortDirParam:
      type: string
      enum:
      - asc
      - desc
    StatsResponse:
      type: object
      required:
      - card_number
      - card_price_number
      - db_size_mb
      properties:
        card_number:
          type: integer
          format: int32
          minimum: 0
        card_price_number:
          type: integer
          format: int32
          minimum: 0
        db_size_mb:
          type: integer
          format: int32
          minimum: 0
    TradeBindersResponse:
      type: object
      required:
      - binders
      properties:
        binders:
          type: array
          items:
            type: string
    TradeCardResponse:
      type: object
      description: |-
        One card offered in a trade, from either side. Which side it's on is conveyed by which of
        `TradeDetailResponse::my_cards`/`partner_cards` it's found in, not by a field here.
      required:
      - set_code
      - collector_number
      - language_code
      - foil
      - name
      - quantity
      - scryfall_id
      properties:
        collector_number:
          type: string
        foil:
          type: boolean
        language_code:
          type: string
        name:
          type: string
        price_guide:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PriceGuideResponse'
        quantity:
          type: integer
          format: int32
          minimum: 0
        scryfall_id:
          type: string
        set_code:
          type: string
        the_gatherer_id:
          type:
          - string
          - 'null'
    TradeDetailResponse:
      type: object
      required:
      - id
      - status
      - partner_username
      - my_cards
      - partner_cards
      - me
      - partner
      properties:
        id:
          type: string
        me:
          $ref: '#/components/schemas/TradePartyStateResponse'
        my_cards:
          type: array
          items:
            $ref: '#/components/schemas/TradeCardResponse'
        partner:
          $ref: '#/components/schemas/TradePartyStateResponse'
        partner_cards:
          type: array
          items:
            $ref: '#/components/schemas/TradeCardResponse'
        partner_username:
          type: string
        status:
          type: string
    TradePartyStateResponse:
      type: object
      description: |-
        One party's acceptance/confirmation/rating state, already resolved from the caller's point
        of view (`me` vs `partner`) — see `TradeDetailResponse`.
      required:
      - accepted
      - confirmed
      properties:
        accepted:
          type: boolean
        confirmed:
          type: boolean
        rating:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    TradeStatusParam:
      type: string
      description: |-
        Status filter values for `GET /trades`, repeated for multiple statuses
        (e.g. `?status=PENDING&status=CLOSED`), mirroring `RarityCodeParam` on `/search/card`.
      enum:
      - PENDING
      - ONE_ACCEPTED
      - FULLY_ACCEPTED
      - COMPLETED
      - CLOSED
      - ABANDONED
    TradeSummaryResponse:
      type: object
      required:
      - id
      - status
      - partner_username
      - my_card_count
      - partner_card_count
      - updated_at
      properties:
        id:
          type: string
        my_card_count:
          type: integer
          format: int32
          minimum: 0
        partner_card_count:
          type: integer
          format: int32
          minimum: 0
        partner_username:
          type: string
        status:
          type: string
        updated_at:
          type: string
          description: RFC 3339 timestamp
    UserSuggestionResponse:
      type: object
      required:
      - username
      - note
      - card_count
      properties:
        card_count:
          type: integer
          format: int64
          minimum: 0
        note:
          type: integer
          format: int32
          description: Always 5 — hardcoded display value, not backed by any stored rating yet.
          minimum: 0
        username:
          type: string
    VisibilityResponse:
      type: object
      required:
      - visibility
      properties:
        visibility:
          $ref: '#/components/schemas/CollectionVisibilityParam'
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: card
  description: Single card lookup, price history and sale offers (authentication required)
- name: collection
  description: Player's private collection (authentication required, no public catalog)
- name: search
  description: Public card search across all users' collections (authentication required)
- name: maintenance
  description: Maintenance operations (public)
- name: auth
  description: Authentication and user registration (authentication required)
- name: trades
  description: Trade requests between two collectors (authentication required)
- name: autocomplete
  description: Public username autocomplete (no authentication)
