name: lint-test-frontend

on: push

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: "frontend/package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Prettier Check
        working-directory: frontend
        run: pnpm format

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: "frontend/package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: "frontend/package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The `postinstall` hook (`nuxt prepare`) generates `.nuxt/eslint.config.mjs`, which
      # `eslint.config.mjs` imports.
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: ESLint
        working-directory: frontend
        run: pnpm run eslint

  build-production:
    name: Build Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: "frontend/package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build Production
        working-directory: frontend
        run: pnpm build
