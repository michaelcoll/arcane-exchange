name: lint-test-backend

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lints

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

      - run: SQLX_OFFLINE=true cargo clippy --locked --workspace --all-features --all-targets -- -D clippy::all

  test:
    name: Tests
    runs-on: ubuntu-latest

    container: rust:1-bookworm

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - run: echo "DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres" >> .env

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools
          cache-key: rust-1-bookworm

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - run: cargo install sqlx-cli --no-default-features --features rustls,postgres
      - run: sqlx migrate run

      - run: cargo llvm-cov nextest --status-level slow --locked --workspace --all-features --bin ae --tests --ignore-filename-regex "main.rs|infrastructure.rs|generate_openapi.rs" --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
          files: lcov.info
          disable_search: true

  build-offline:
    name: Build Offline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: SQLX_OFFLINE=true cargo build

  check-openapi:
    name: OpenAPI spec up-to-date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Save current OpenAPI spec
        run: cp docs/openapi.yml docs/openapi.yml.bak

      - name: Regenerate OpenAPI spec
        run: SQLX_OFFLINE=true cargo run --bin generate-openapi

      - name: Check openapi.yml is up-to-date
        run: |
          if ! diff -q docs/openapi.yml.bak docs/openapi.yml > /dev/null 2>&1; then
            echo "::error file=docs/openapi.yml::Le fichier docs/openapi.yml n'est pas à jour. Lancez 'mise run rebuild-docs' et committez les changements."
            diff docs/openapi.yml.bak docs/openapi.yml
            exit 1
          fi
