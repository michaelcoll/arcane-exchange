name: build-and-push

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Extract metadata (tags, labels) for Docker
        id: meta-back
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/michaelcoll/arcane-exchange-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Bump version for release
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          sed -i "s/^version = \".*\"/version = \"$TAG\"/" backend/Cargo.toml

      - name: Build and push Docker backend image
        uses: docker/build-push-action@v7
        with:
          context: backend/
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta-back.outputs.tags }}
          labels: ${{ steps.meta-back.outputs.labels }}

      - name: Restore Cargo.toml version
        if: github.event_name == 'release'
        run: |
          sed -i 's/^version = ".*"/version = "0.1.0"/' backend/Cargo.toml

      - name: Create Sentry release
        if: github.event_name == 'release'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_BACK }}
        with:
          environment: production
          ignore_missing: "true"
          release: ${{ github.event.release.tag_name }}

  build-and-push-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend Extract metadata (tags, labels) for Docker
        id: meta-front
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/michaelcoll/arcane-exchange-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Bump version for release
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$TAG\"/" frontend/package.json

      - name: Build and push Docker frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta-front.outputs.tags }}
          labels: ${{ steps.meta-front.outputs.labels }}

      - name: Restore package.json version
        if: github.event_name == 'release'
        run: |
          sed -i 's/\"version\": \".*\"/\"version\": \"0.0.0\"/' frontend/package.json

  publish-frontend-sourcemaps:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: "frontend/package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Create Sentry release and upload source maps
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_FRONT }}
        run: pnpm build
