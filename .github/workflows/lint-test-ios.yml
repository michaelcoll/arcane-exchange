name: lint-test-ios

on:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/lint-test-ios.yml"
      # The iOS tools are installed from it.
      - "mise.toml"

# The iOS tools come from mise.toml, as locally, not from Homebrew: `brew install` could spend up to
# 3 min in an automatic `brew update`. `install_args` limits each job to the tools it runs, the rest
# of mise.toml (cargo, npm, swift…) is left alone. The `lefthook install` postinstall hook fails on
# the runner, without lefthook: mise only logs it as a warning.
jobs:
  lint:
    name: Format & Lint
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen, SwiftFormat & SwiftLint
        uses: jdx/mise-action@v5
        with:
          install_args: aqua:yonaskolb/XcodeGen github:nicklockwood/SwiftFormat aqua:realm/SwiftLint
          env: false

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      - name: SwiftFormat Check
        working-directory: ios-app
        run: swiftformat ArcaneExchange APIClient/Sources --lint

      - name: SwiftLint
        working-directory: ios-app
        run: swiftlint lint --strict ArcaneExchange APIClient/Sources

  test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Pre-boot the simulator
        run: nohup xcrun simctl boot "iPhone 17" >/dev/null 2>&1 &

      - name: Install XcodeGen & xcbeautify
        uses: jdx/mise-action@v5
        with:
          install_args: aqua:yonaskolb/XcodeGen aqua:cpisciotta/xcbeautify
          env: false

      - name: Install the Metal toolchain
        # Xcode 26 ships the `metal` compiler as a downloadable component, and
        # `ArcaneExchange/Features/CardDetail/Foil.metal` will not build without it. Skipped
        # when the runner image already carries it.
        run: |
          xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed' \
            || xcodebuild -downloadComponent MetalToolchain

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      # APIClient's Package.resolved is the app's lockfile: XcodeGen's project has no workspace
      # Package.resolved, so Xcode pins the whole graph (Clerk, Nuke…) in the local package's.
      # Keyed on it, a version bump is a cache miss and gets fresh checkouts. The old key ignored
      # bumps: it restored stale checkouts that were updated over the network on every run, and
      # never saved again.
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ios-app/.spm-cache
          key: spm-${{ hashFiles('ios-app/APIClient/Package.resolved') }}

      # ImageOS and ImageVersion are set on the runner, not in the `env` expression context.
      - name: Read the runner image and Xcode versions
        id: toolchain
        run: |
          xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')
          echo "key=$ImageOS-$ImageVersion-xcode-$xcode" >> "$GITHUB_OUTPUT"

      # Saves the ~4 min spent compiling the packages (Clerk, Nuke, PhoneNumberKit, OpenAPI…).
      # The key holds everything that can make a compiled package stale: the pinned versions, the
      # Xcode build, the runner image, and the manifests that decide how each package is linked
      # (static or dynamic): a build over products linked another way fails on undefined symbols. No restore-keys: a partial match would restore products
      # built by another compiler or from other sources, and an incremental build trusts them.
      # Sources in the repo are checked out with fresh mtimes and always rebuild: the app, and the
      # local APIClient package with its OpenAPI generation.
      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ios-app/DerivedData
            !ios-app/DerivedData/Logs
            !ios-app/DerivedData/Index.noindex
          key: deriveddata-${{ steps.toolchain.outputs.key }}-${{ hashFiles('ios-app/APIClient/Package.resolved', 'ios-app/APIClient/Package.swift', 'ios-app/project.yml') }}

      # -disableAutomaticPackageResolution builds the pinned versions or fails: a Package.resolved
      # out of date with project.yml breaks the build instead of being silently re-resolved.
      # The runner's simulator is offered in arm64 and x86_64: without `arch=arm64`, xcodebuild
      # warns "Using the first of multiple matching destinations" and spends ~45 s before the build.
      # NSUnbufferedIO streams xcodebuild's output as it goes: piped, it is block-buffered and
      # reaches the log in bursts minutes apart, which hide where the time goes.
      - name: Test
        working-directory: ios-app
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          xcodebuild -scheme ArcaneExchange \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" test \
            | xcbeautify --renderer github-actions

      # The tests run with no host app: a library linked twice (its singletons configured in one
      # copy, read in the other) or not embedded (found in DerivedData by the simulator only)
      # only shows at launch. The Test step built the app anyway.
      - name: Check how the app links its libraries
        working-directory: ios-app
        run: scripts/check-app-linking.sh DerivedData/Build/Products/Debug-iphonesimulator/ArcaneExchange.app

      # A crash of the test process leaves nothing readable in the log ("Test crashed with
      # signal trap before establishing connection"): its stack trace is only in the result
      # bundle and in the simulator's crash reports.
      - name: Upload the test results and crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore
          retention-days: 7
