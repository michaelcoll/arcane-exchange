services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - /mnt/ssd/containers/config/ccpt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/michaelcoll/arcane-exchange:1.27.0
    user: "${PUID:-65532}:${PGID:-65532}"
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      BACKEND_PORT: 8080
      CARDMARKET_PRICE_GUIDES_URL: https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_1.json
      EDHREC_BASE_URL: https://edhrec.com
      SCRYFALL_BASE_URL: https://api.scryfall.com
      CLERK_FRONTEND_API_URL: ${CLERK_FRONTEND_API_URL}
      CARD_IMAGES_DIR: /data/card-images
    volumes:
      # Written by the backend only (ADR 0017); back it up with the database.
      - /mnt/ssd/containers/config/ccpt/card-images:/data/card-images

  frontend:
    image: ghcr.io/michaelcoll/arcane-exchange-frontend:1.27.0
    pull_policy: always
    restart: unless-stopped
    ports:
      - "9797:3000"
    environment:
      NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      NUXT_CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_TELEMETRY_DISABLED: 1
      CARD_IMAGES_DIR: /data/card-images
    volumes:
      # Served by Nitro under /card-images/**, read only.
      - /mnt/ssd/containers/config/ccpt/card-images:/data/card-images:ro
    depends_on:
      - backend
