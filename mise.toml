[hooks]
postinstall = "lefthook install"

[env]
# Database
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "password"
POSTGRES_DB = "postgres"
DATABASE_URL = "postgresql://postgres:password@localhost:5432/postgres"

# Server
BACKEND_PORT = "8080"
# Card images: written by the backend, served by the frontend (Nitro) — same folder for both.
CARD_IMAGES_DIR = "{{config_root}}/.card-images"

# External APIs
CARDMARKET_PRICE_GUIDES_URL = "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_1.json"
EDHREC_BASE_URL = "https://json.edhrec.com"
SCRYFALL_BASE_URL = "https://api.scryfall.com"

[vars]
# Tables left out of docs/db.md, for both `rebuild-db-doc` and `check-db-doc`.
erdify_ignored_tables = "databases,_sqlx_migrations"

[tools]
"aqua:cpisciotta/xcbeautify" = "latest"
"aqua:realm/SwiftLint" = "latest"
"aqua:yonaskolb/XcodeGen" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:erdify-rs" = "1"
"cargo:sqlx-cli" = "latest"
"cargo:cargo-sweep" = "latest"
"github:nicklockwood/SwiftFormat" = "latest"
"go:github.com/evilmartians/lefthook/v2" = "latest"
"npm:@playwright/cli" = "latest"
"npm:typescript-language-server" = "latest"
node = "26"
pnpm = "12"
swift = "latest"

[tasks.checks]
# `lint-ios` is in, `build-ios` / `test-ios` are deliberately out: lefthook.yml has no per-folder
# scoping, so they would fire Xcode on every commit regardless of what changed.
description = "Runs all the checks for the project, the generated files included (checked, not regenerated)"
depends = ["check-docs", "test-backend", "test-frontend", "lint-backend", "lint-frontend", "lint-ios", "test-release-announcement"]

[tasks.clean-backend]
dir = "backend"
run = "cargo clean"
hide = true

[tasks.clean-frontend]
dir = "frontend"
run = "rm -fr .nuxt .output node_modules"
hide = true

[tasks.clean]
description = "Cleans the project artifacts"
depends = ["clean-backend", "clean-frontend"]

[tasks.install-frontend-deps]
dir = "frontend"
depends = ["clean-frontend"]
run = "pnpm install"
hide = true

[tasks.install-backend-deps]
dir = "backend"
run = "cargo fetch --locked"
hide = true

[tasks.setup]
description = "Setups the project for development"
depends = ["clean", "install-backend-deps", "install-frontend-deps"]

[tasks.rebuild-docs]
description = "Regenerates docs/openapi.yml (utoipa) and docs/db.md (ERD)"
depends = ["rebuild-openapi-doc", "rebuild-db-doc"]

[tasks.rebuild-openapi-doc]
hide = true
dir = "backend"
run = "cargo run --bin generate-openapi"

[tasks.rebuild-db-doc]
hide = true
# Run from the root: docs/ is shared, not backend-only. `--lock` records the schema hash that
# `check-db-doc` verifies; the lock file is committed along with db.md.
run = "erdify --full --ignore-tables {{vars.erdify_ignored_tables}} --output docs/db.md --lock docs/erdify.lock"

[tasks.check-docs]
description = "Checks that docs/openapi.yml and docs/db.md are up to date"
depends = ["check-openapi-doc", "check-db-doc"]

[tasks.check-openapi-doc]
hide = true
dir = "backend"
# The binary names `mise run rebuild-docs` itself when the file is stale.
run = "SQLX_OFFLINE=true cargo run --bin generate-openapi -- --check"

[tasks.check-db-doc]
hide = true
# Compares the live dev database to the lock: it needs a running database with every migration
# applied (`mise run migrate`), otherwise it reports a stale db.md that is not.
run = """
erdify --ignore-tables {{vars.erdify_ignored_tables}} --check docs/erdify.lock \
  || { echo "docs/db.md is out of date: run 'mise run rebuild-docs' and commit the changes." >&2; exit 1; }
"""

[tasks.sqlx-prepare]
description = "Regenerates the .sqlx metadata — required after changing any SQL query (needs a running database)"
dir = "backend"
run = "rm -fr .sqlx && cargo sqlx prepare --workspace -- --tests"

[tasks.test-backend]
description = "Tests the backend — also regenerates the frontend TS bindings (ts-rs runs at compile time)"
dir = "backend"
# Skipped when nothing the tests read has changed since the last successful run (`outputs` defaults
# to `{ auto = true }`, i.e. an internal state file). `mise run --force test-backend` to bypass.
# The three crate roots are excluded because `cargo sqlx prepare --check` (run by `lint-sqlx`, a
# sibling inside `checks`) touches them on every run, which would defeat the skip. Globs are
# relative to `dir`.
sources = [
    "src/**/*.rs",
    "!src/ae/lib.rs",
    "!src/ae/main.rs",
    "!src/ae/generate_openapi.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "migrations/**/*.sql",
    ".config/nextest.toml",
]
run = "cargo nextest run --status-level slow"
depends_post = ["format-frontend"]

[tasks.test-frontend]
description = "Tests the frontend"
dir = "frontend"
# Skipped when no source changed since the last successful run — `--force` to bypass.
# Globs are relative to `dir`.
sources = [
    "app/**/*.{ts,vue}",
    "test/**/*.ts",
    "vitest.config.ts",
    "nuxt.config.ts",
    "package.json",
    "pnpm-lock.yaml",
]
run = "pnpm run test"

[tasks.lint-clippy]
dir = "backend"
# Skipped when no source changed since the last successful run — `--force` to bypass. Runs offline
# against the committed `.sqlx/`, so a changed `.sqlx/` must re-run it. The three crate roots are
# excluded: `cargo sqlx prepare --check` (`lint-sqlx`) touches them on every run, which would defeat
# the skip. Globs are relative to `dir`.
sources = [
    "src/**/*.rs",
    "!src/ae/lib.rs",
    "!src/ae/main.rs",
    "!src/ae/generate_openapi.rs",
    "tests/**/*.rs",
    ".sqlx/**/*.json",
    "Cargo.toml",
    "Cargo.lock",
    "migrations/**/*.sql",
]
run = "SQLX_OFFLINE=true cargo clippy --locked --workspace --all-features --all-targets -- -D clippy::all"
hide = true

[tasks.lint-sqlx]
dir = "backend"
# Needs a running database. Same crate-root exclusions as lint-clippy: it touches them itself, on
# every run.
sources = [
    "src/**/*.rs",
    "!src/ae/lib.rs",
    "!src/ae/main.rs",
    "!src/ae/generate_openapi.rs",
    "tests/**/*.rs",
    ".sqlx/**/*.json",
    "Cargo.toml",
    "Cargo.lock",
    "migrations/**/*.sql",
]
run = """
cargo sqlx prepare --check --workspace -- --tests \
  || { echo ".sqlx is out of date: run 'mise run sqlx-prepare' and commit the changes." >&2; exit 1; }
"""
hide = true

[tasks.lint-backend]
description = "Lints the backend of project"
depends = ["lint-clippy", "lint-sqlx"]

[tasks.lint-frontend]
description = "Lints the frontend of project (nuxi typecheck + ESLint, warnings included)"
dir = "frontend"
# `pnpm lint` = `pnpm run typecheck` + `pnpm run eslint` (two separate jobs in CI). Both cover the
# whole project, so does this list. Globs are relative to `dir`.
sources = [
    "app/**/*.{ts,vue}",
    "server/**/*.ts",
    "test/**/*.ts",
    "*.{ts,mjs}",
    "tsconfig.json",
    "server/tsconfig.json",
    "package.json",
    "pnpm-lock.yaml",
]
run = "pnpm lint"

[tasks.format-backend]
dir = "backend"
run = "cargo fmt"
hide = true

[tasks.format-frontend]
dir = "frontend"
run = "pnpm format:fix"
hide = true
quiet = true

[tasks.format]
description = "Formats the codebase"
depends = ["format-backend", "format-frontend", "format-ios"]
alias = ["f"]

[tasks.migrate]
description = "Runs the database migrations"
dir = "backend"
run = "sqlx migrate run"

[tasks.upgrade-backend]
dir = "backend"
run = "cargo update"
hide = true

[tasks.upgrade-frontend]
dir = "frontend"
run = "pnpm update"
hide = true

[tasks.upgrade-ios]
# APIClient's Package.resolved is also the app's lockfile. Its Package.swift declares every remote
# package of project.yml, so SwiftPM pins the whole graph, as Dependabot does.
dir = "ios-app"
run = "swift package --package-path APIClient update"
hide = true

[tasks.upgrade]
description = "Upgrades the project dependencies"
depends = ["upgrade-backend", "upgrade-frontend", "upgrade-ios"]

[tasks.back]
description = "Runs the backend server"
dir = "backend"
run = "cargo run --bin ae"

[tasks.front]
description = "Runs the frontend development server"
dir = "frontend"
run = "pnpm dev"

[tasks.maquette]
description = "Serve the static mockups of the app"
dir = "frontend"
run = "pnpm serve:maquette"

[tasks.build-backend]
description = "Builds the backend"
dir = "backend"
run = "cargo build"
alias = ["bb"]

[tasks.build-frontend]
description = "Builds the frontend"
dir = "frontend"
depends = ["install-frontend-deps"]
run = "pnpm build"
alias = ["bf"]

[tasks.coverage-backend]
description = "Runs the backend tests with coverage — prints a per-file summary and writes backend/lcov.info"
dir = "backend"
run = "cargo llvm-cov nextest --status-level slow --locked --workspace --all-features --bin ae --tests --ignore-filename-regex \"main.rs|infrastructure.rs|generate_openapi.rs\" --lcov --output-path lcov.info"

[tasks.generate-ios]
dir = "ios-app"
run = "xcodegen generate"
hide = true

[tasks.generate-api-client]
description = "Regenerates the iOS APIClient sources from docs/openapi.yml"
dir = "ios-app/APIClient"
sources = ["../../docs/openapi.yml"]
outputs = ["Sources/APIClient/GeneratedSources/Client.swift"]
run = "swift run swift-openapi-generator generate --mode types --mode client --access-modifier public --output-directory Sources/APIClient/GeneratedSources ../../docs/openapi.yml"

[tasks.setup-ios]
# SwiftPM equivalent of `cargo fetch` / `pnpm install`: resolves and checks out every package of
# Package.resolved (Clerk, Nuke, swift-openapi-*, the local APIClient) without compiling anything.
# Kept out of `setup` so a checkout without Xcode can still be set up.
description = "Resolves the iOS SwiftPM dependencies without building them"
dir = "ios-app"
depends = ["generate-ios"]
run = "xcodebuild -resolvePackageDependencies -project ArcaneExchange.xcodeproj -scheme ArcaneExchange"

[tasks.build-ios]
description = "Builds the iOS app"
dir = "ios-app"
depends = ["generate-ios"]
# arm64 only: a generic simulator destination also builds x86_64 (Intel Macs, none here), and
# Xcode's own arm64-only builds in the same DerivedData then break its link.
run = "xcodebuild -scheme ArcaneExchange -configuration Debug -destination 'generic/platform=iOS Simulator' ARCHS=arm64 build"
alias = ["bi"]

[tasks.check-ios-linking]
description = "Checks that the built iOS app links each Swift module once and embeds every library it loads"
dir = "ios-app"
depends = ["build-ios"]
run = """
products=$(xcodebuild -scheme ArcaneExchange -configuration Debug -destination 'generic/platform=iOS Simulator' \
  -showBuildSettings 2>/dev/null | awk '$1 == "BUILT_PRODUCTS_DIR" { print $3; exit }')
scripts/check-app-linking.sh "$products/ArcaneExchange.app"
"""

[tasks.boot-ios-simulator]
# Left to itself, xcodebuild boots the simulator and shuts it down after every run: each run then
# pays a cold boot, whose first-boot work slows the app install and launch to ~2m40 against ~50 s
# warm. A simulator booted here stays up between runs. No-op when already booted. Same device name
# as the `test-ios` destination.
dir = "ios-app"
run = "xcrun simctl bootstatus 'iPhone 17' -b"
hide = true

[tasks.test-ios]
description = "Tests the iOS app"
dir = "ios-app"
depends = ["generate-ios", "boot-ios-simulator"]
run = "xcodebuild -scheme ArcaneExchange -destination 'platform=iOS Simulator,name=iPhone 17' test"

[tasks.test-release-announcement]
description = "Tests the script that announces each release on Discord (node:test, no dependency)"
dir = ".github/scripts/release-announcement"
run = "node --test"

[tasks.lint-ios]
description = "Lints the iOS app"
dir = "ios-app"
# Exactly the paths passed to swiftlint, plus its config. Globs are relative to `dir`.
sources = [
    "ArcaneExchangeCore/**/*.swift",
    "ArcaneExchange/**/*.swift",
    "ArcaneExchangeWidgets/**/*.swift",
    "APIClient/Sources/**/*.swift",
    ".swiftlint.yml",
]
run = "swiftlint lint --strict ArcaneExchangeCore ArcaneExchange ArcaneExchangeWidgets APIClient/Sources"

[tasks.format-ios]
dir = "ios-app"
run = "swiftformat ArcaneExchangeCore ArcaneExchange ArcaneExchangeWidgets APIClient/Sources"
hide = true

[tasks.clean-ios]
dir = "ios-app"
run = "rm -fr ArcaneExchange.xcodeproj .build APIClient/.build DerivedData"
hide = true
